<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolify — We've Moved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 70px;
    }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #111;
      color: #fff;
      font-size: 30px;
      font-weight: 600;
    }

    h1 {
      font-size: clamp(38px, 7vw, 58px);
      letter-spacing: -2.5px;
      line-height: 1;
      margin-bottom: 20px;
    }

    p {
      max-width: 500px;
      margin: 0 auto 30px;
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .address {
      display: inline-block;
      max-width: 100%;
      padding: 13px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #fafafa;
      color: #333;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 22px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 30px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="logo">Toolify</div>

    <div class="icon">↗</div>

    <h1>We've moved.</h1>

    <p>
      Toolify has moved to a new address.
      Visit our new website to access the latest version of Toolify.
    </p>

    <div class="address">
      https://mohakchoubey.github.io/toolify/
    </div>

    <br>

    <a
      class="button"
      href="https://mohakchoubey.github.io/toolify/"
    >
      Go to Toolify
    </a>

    <div class="footer">
      Thank you for visiting Toolify.
    </div>

  </div>

</body>
</html>
