<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolify — We've Moved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }

    /* Top Countdown Banner */
    .banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 1000;
    }

    .banner span {
      font-weight: 700;
      color: #ffcc00;
    }

    .page {
      width: 100%;
      max-width: 620px;
      text-align: center;
      margin-top: 40px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 50px;
    }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #111;
      color: #fff;
      font-size: 30px;
      font-weight: 600;
    }

    h1 {
      font-size: clamp(38px, 7vw, 58px);
      letter-spacing: -2.5px;
      line-height: 1;
      margin-bottom: 20px;
    }

    p {
      max-width: 500px;
      margin: 0 auto 30px;
      color: #666;
      font-size: 17px;
      line-height: 1.6;
    }

    .address {
      display: inline-block;
      max-width: 100%;
      padding: 13px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #fafafa;
      color: #333;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 22px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #111;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 30px;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- Top Redirect Banner -->
  <div class="banner">
    This domain has changed. Redirecting to new site in <span id="countdown">10</span> seconds...
  </div>

  <!-- Hidden Audio Element (Replace with your actual mp3 file link or path) -->
  <audio id="alert-audio" src="./toolify/redirect.mp3" preload="auto"></audio>

  <div class="page">
    <div class="logo">Toolify</div>
    <div class="icon">↗</div>
    <h1>We've moved.</h1>
    <p>
      This domain is changed. Toolify has moved to a new address. 
      Visit our new website to access the latest version.
    </p>

    <div class="address">
      https://mohakchoubey.github.io/toolify/
    </div>

    <br>

    <a class="button" href="https://mohakchoubey.github.io/toolify/">
      Go to Toolify Now
    </a>

    <div class="footer">
      Thank you for visiting Toolify.
    </div>
  </div>

  <script>
    // 1. Attempt to play audio automatically
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('alert-audio');
      audio.play().catch(error => {
        // Browsers sometimes block autoplay if user hasn't interacted with the page yet.
        console.log("Autoplay blocked by browser policy:", error);
      });
    });

    // 2. Countdown and Redirect Logic (10 seconds)
    let timeLeft = 10;
    const countdownEl = document.getElementById('countdown');
    const targetUrl = "https://mohakchoubey.github.io/toolify/";

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = targetUrl;
      }
    }, 1000);
  </script>

</body>
</html>
